name: Build macOS Test DMG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "feature/desktop-zone-ux"
        type: string

permissions:
  contents: read

concurrency:
  group: test-macos-dmg-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: macOS arm64 test DMG
    runs-on: macos-latest

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Prepare desktop bundle
        run: npm run desktop:prepare

      - name: Build unsigned DMG
        run: node scripts/run-tauri.mjs build --bundles dmg --no-sign --ci

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts

          DMG="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"

          SHORT_SHA="$(git rev-parse --short HEAD)"
          cp "$DMG" "test-artifacts/Easy.Local.MCP_0.4.0-dev_${SHORT_SHA}_macos-arm64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: easy-local-mcp-macos-arm64-test
          path: test-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7
